services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${DB_USER:-timely}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root123}
      POSTGRES_DB: ${DB_NAME:-timely_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-timely} -d ${DB_NAME:-timely_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      API_PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-timely}
      DB_PASSWORD: ${DB_PASSWORD:-root123}
      DB_NAME: ${DB_NAME:-timely_db}
      DB_SSLMODE: disable
      TIMELY_BACKUP_DIR: /data/backups
    ports:
      - "8080:8080"
    volumes:
      - apidata:/data
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:-}
      API_ORIGIN: http://api:8080
    ports:
      - "4001:4001"
    depends_on:
      - api

volumes:
  pgdata:
  apidata:
