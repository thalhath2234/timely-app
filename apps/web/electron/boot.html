<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Starting Timely</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f8;
        --fg: #1a1a1f;
        --muted: #6b6b76;
        --line: #e2e2e8;
        --ok: #1f8f4e;
        --bad: #c23b3b;
        --accent: #3b5bdb;
        --panel: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141418;
          --fg: #f1f1f4;
          --muted: #9a9aa6;
          --line: #2a2a32;
          --ok: #4cc27a;
          --bad: #ef6b6b;
          --accent: #7b93ff;
          --panel: #1c1c22;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-user-select: none;
        user-select: none;
      }
      main { width: 360px; padding: 28px 32px; }
      header { display: flex; flex-direction: column; align-items: center; text-align: center; margin: 0 0 20px; }
      .logo { display: block; margin: 0 0 16px; overflow: visible; }
      .logo rect { fill: var(--fg); }
      .logo rect.accent { fill: var(--accent); }
      h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
      .sub { color: var(--muted); margin: 0; }
      /* The animated Timely mark (TimelyLogo in app/_components/_ui/timelyLogo.tsx
         and the tl-bar keyframes in app/globals.css): each block draws in from
         the left, holds, then clears for the next loop. */
      @keyframes tl-bar {
        0% { transform: scaleX(0); }
        18%, 82% { transform: scaleX(1); }
        96%, 100% { transform: scaleX(0); }
      }
      .logo.animated rect {
        transform-box: fill-box;
        transform-origin: left center;
        animation: tl-bar 4s cubic-bezier(0.65, 0, 0.35, 1) var(--tl-delay, 0s) infinite both;
      }
      ol { list-style: none; margin: 0; padding: 0; }
      li {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 8px 0;
        border-top: 1px solid var(--line);
      }
      li:first-child { border-top: 0; }
      .icon {
        flex: 0 0 18px;
        width: 18px;
        height: 18px;
        margin-top: 1px;
        border-radius: 50%;
        border: 2px solid var(--line);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
        color: #fff;
      }
      li[data-state="running"] .icon { border-color: var(--accent); }
      li[data-state="running"] .icon::after {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
      }
      li[data-state="done"] .icon { background: var(--ok); border-color: var(--ok); }
      li[data-state="failed"] .icon { background: var(--bad); border-color: var(--bad); }
      li[data-state="pending"] { color: var(--muted); }
      .label { flex: 1; }
      .detail { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
      #error {
        margin-top: 18px;
        padding: 12px 14px;
        border: 1px solid var(--bad);
        border-radius: 8px;
        background: var(--panel);
      }
      #error[hidden] { display: none; }
      #error h2 { font-size: 14px; margin: 0 0 6px; color: var(--bad); }
      #error p { margin: 0 0 12px; white-space: pre-wrap; word-break: break-word; -webkit-user-select: text; user-select: text; }
      .actions { display: flex; gap: 8px; justify-content: flex-end; }
      button {
        font: inherit;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--fg);
        cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      @media (prefers-reduced-motion: reduce) { .logo.animated rect { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <svg class="logo animated" id="logo" width="56" height="56" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="4" y="5.5" width="24" height="5.5" rx="2.75" />
          <rect x="4" y="21" width="20" height="5.5" rx="2.75" style="--tl-delay: 0.16s" />
          <rect class="accent" x="4" y="13.25" width="15" height="5.5" rx="2.75" style="--tl-delay: 0.4s" />
        </svg>
        <h1>Preparing Timely</h1>
        <p class="sub" id="subtitle">Starting your private server…</p>
      </header>
      <ol id="steps" role="status" aria-live="polite" aria-label="Startup progress">
        <li data-step="postgres" data-state="pending"><span class="icon" aria-hidden="true"></span><span class="label">Starting database</span></li>
        <li data-step="api" data-state="pending"><span class="icon" aria-hidden="true"></span><span class="label">Starting server</span></li>
        <li data-step="web" data-state="pending"><span class="icon" aria-hidden="true"></span><span class="label">Starting app</span></li>
      </ol>
      <section id="error" role="alert" hidden>
        <h2 id="error-title">Timely could not start</h2>
        <p id="error-message"></p>
        <div class="actions">
          <button type="button" id="open-logs">Open logs</button>
          <button type="button" id="quit" class="primary">Quit</button>
        </div>
      </section>
    </main>
    <script>
      (function () {
        var bridge = window.timelyBoot;
        var marks = { pending: "", running: "", done: "✓", failed: "!" };
        function render(status) {
          var list = document.getElementById("steps");
          (status.steps || []).forEach(function (step) {
            var li = list.querySelector('li[data-step="' + step.id + '"]');
            if (!li) return;
            li.dataset.state = step.state;
            li.querySelector(".icon").textContent = marks[step.state] || "";
            var label = li.querySelector(".label");
            var text = step.label;
            label.textContent = text;
            if (step.detail) {
              var detail = document.createElement("span");
              detail.className = "detail";
              detail.textContent = step.detail;
              label.appendChild(detail);
            }
          });
          var panel = document.getElementById("error");
          if (status.error) {
            document.getElementById("error-title").textContent = status.error.title || "Timely could not start";
            document.getElementById("error-message").textContent = status.error.message || "";
            document.getElementById("subtitle").textContent = "Something went wrong.";
            document.getElementById("logo").classList.remove("animated");
            panel.hidden = false;
            document.getElementById("open-logs").focus();
          } else {
            document.getElementById("logo").classList.add("animated");
            panel.hidden = true;
          }
        }
        if (!bridge) return;
        bridge.onStatus(render);
        document.getElementById("open-logs").addEventListener("click", function () { bridge.openLogs(); });
        document.getElementById("quit").addEventListener("click", function () { bridge.quit(); });
        bridge.ready();
      })();
    </script>
  </body>
</html>
