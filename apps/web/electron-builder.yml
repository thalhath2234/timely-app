appId: app.timely.desktop
productName: Timely
executableName: Timely
copyright: Copyright © Timely

# App icon: electron/resources/icon.png (1024 px). electron-builder derives the
# .icns and .ico from it. Linux points at the directory instead (see linux.icon)
# so it renders the hicolor size set rather than shipping the lone 1024 px PNG.
directories:
  output: release
  buildResources: electron/resources

files:
  - dist-electron/**/*
  - electron/resources/icon.png
  - package.json
  - "!.cache/**"
  - "!.electron-api/**"
  - "!.electron-postgres/**"
  - "!.electron-next/**"

# Sidecars live outside the asar. The per-target staging directories are named
# after electron-builder's ${os}-${arch} macros (linux-x64, mac-arm64, win-x64;
# see electron/targets.mjs) so one static config serves every target.
# Binding layout (docs/desktop/README.md): resources/api, resources/postgres,
# resources/next-server.
extraResources:
  - from: .electron-next
    to: next-server
  - from: .electron-api/${os}-${arch}
    to: api
  - from: .electron-postgres/${os}-${arch}
    to: postgres

extraMetadata:
  name: timely-desktop
  main: dist-electron/main.js
  # The pacman package's URL and licence; electron-builder refuses to build it
  # without a homepage.
  homepage: https://github.com/thalhath2234/timely-app
  license: MIT

asar: true
npmRebuild: false
nodeGypRebuild: false

# electron-updater reads latest*.yml from the GitHub release assets.
# Uploading happens only when electron-builder runs with --publish always
# (release.yml does that for v* tags with GH_TOKEN).
publish:
  provider: github
  owner: thalhath2234
  repo: timely-app
  releaseType: release

linux:
  target:
    - dir
    - AppImage
    - pacman
  category: Office
  # A directory holding only icon.png makes electron-builder generate 16-512 px
  # PNGs. Given the file itself it ships just 1024x1024, a size the hicolor
  # theme doesn't index, so launchers show a blank icon.
  icon: electron/resources
  desktop:
    entry:
      StartupWMClass: Timely
  artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

# Arch Linux package: `sudo pacman -U Timely-X.Y.Z-linux-x64.pacman`. It marks
# itself with resources/package-type, so electron-updater updates it in place
# (pacman -U through pkexec) instead of treating it as package-managed.
# Named "timely" because the AUR timely-bin declares conflicts=('timely'):
# pacman offers to swap one for the other rather than installing both.
# electron-builder's default pacman depends name packages Arch no longer has
# (http-parser, libappindicator-gtk3), so list the ones timely-bin uses.
pacman:
  packageName: timely
  maintainer: Thalhath <thalhathva2@gmail.com>
  # electron-builder starts the description with a newline (Debian style),
  # which leaves pacman's Description empty; fpm keeps the last --description.
  # electron-builder has no upgrade hook, so add one (path from apps/web).
  fpm:
    - --description
    - Private personal planning, scheduling, and notes.
    - --after-upgrade
    - electron/pacman/after-upgrade.sh
  depends:
    - gtk3
    - nss
    - alsa-lib
    - libxss
    - libxtst
    - libnotify
    - xdg-utils

mac:
  target:
    - dmg
    - zip # required by electron-updater on macOS
    - dir
  category: public.app-category.productivity
  artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
  # Signing: electron-builder picks the Developer ID certificate from
  # CSC_LINK / CSC_KEY_PASSWORD; with neither set (and
  # CSC_IDENTITY_AUTO_DISCOVERY=false) the build is unsigned.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/resources/entitlements.mac.plist
  entitlementsInherit: electron/resources/entitlements.mac.plist
  # Notarization runs only when APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD +
  # APPLE_TEAM_ID are set; otherwise electron-builder logs a warning and skips.
  notarize: true

win:
  target:
    - nsis
    - dir
  artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
  # Signing: set WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD to a .pfx and
  # electron-builder signs the executable and the installer with signtool.
  # Without them the build is unsigned (SmartScreen warns on first run).

nsis:
  oneClick: false
  perMachine: false # Postgres refuses to run elevated; keep the install per-user
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
