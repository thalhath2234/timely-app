<!-- Made up. Imitates the robot check page a large online shop answers with
     200 instead of the product page: the "Robot Check" title and the
     /errors/validateCaptcha form. -->
<!doctype html>
<html class="a-no-js" lang="en-us">
<head>
<meta charset="utf-8">
<title dir="ltr">Robot Check</title>
<meta name="viewport" content="width=device-width">
</head>
<body>
<div class="a-container a-padding-double-large">
  <div class="a-box-inner">
    <h4>Enter the characters you see below</h4>
    <p class="a-last">Sorry, we just need to make sure you're not a robot.</p>
    <form method="get" action="/errors/validateCaptcha" name="">
      <input type="hidden" name="amzn" value="example-token">
      <img src="https://images.example/captcha/abcdef/Captcha_example.jpg">
      <input autocomplete="off" spellcheck="false" placeholder="Type characters" id="captchacharacters" name="field-keywords" type="text">
      <button type="submit">Continue shopping</button>
    </form>
  </div>
</div>
</body>
</html>
