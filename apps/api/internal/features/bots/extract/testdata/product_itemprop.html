<!doctype html>
<!-- Imitates an older shop template marked up with schema.org microdata:
     itemprop="price" with a content attribute, and priceCurrency on a meta. -->
<html>
<head><meta charset="utf-8"><title>Trail Shoe</title></head>
<body>
<div itemscope itemtype="https://schema.org/Product">
  <h1 itemprop="name">Trail Shoe</h1>
  <div itemprop="offers" itemscope itemtype="https://schema.org/Offer">
    <meta itemprop="priceCurrency" content="CAD">
    <span itemprop="price" content="149.99">$149.99</span>
  </div>
</div>
</body>
</html>
