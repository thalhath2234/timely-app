<!doctype html>
<!-- Imitates an Indian appliance store: Indian digit grouping written with
     "Rs." and "₹", a sale price in <del>, labels in <dt>, and one price only
     named by an aria-label. -->
<html lang="en-IN">
<head><meta charset="utf-8"><title>Side-by-side Refrigerator 692 L | ColdStore</title></head>
<body>
<main>
  <h1>Side-by-side Refrigerator 692 L</h1>
  <dl class="prices">
    <dt>Our price</dt><dd class="now">Rs. 1,23,456</dd>
    <dt>List price</dt><dd class="was"><del>₹ 1,49,999.50</del></dd>
  </dl>
  <div class="emi"><span aria-label="Monthly EMI">₹10,288/-</span></div>
  <p>Ships in 3 days. Model RS-692 with 5 year warranty.</p>
</main>
</body>
</html>
