<!doctype html>
<!-- Imitates a job board: listings in a table, each status in a span the
     person picks with a CSS selector. -->
<html>
<head><meta charset="utf-8"><title>Openings</title></head>
<body>
<nav><a href="/">Careers</a></nav>
<table id="openings">
  <tr class="job"><td class="title">Backend engineer</td><td><span class="status">Open</span></td></tr>
  <tr class="job"><td class="title">Designer</td><td><span class="status">Closed</span></td></tr>
</table>
<div class="banner"><div class="banner">Hiring in Pune</div></div>
<footer><span class="status">Site status: fine</span></footer>
</body>
</html>
