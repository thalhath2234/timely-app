<!doctype html>
<!-- Imitates a Shopify store: no JSON-LD offers, only Open Graph product
     tags (og:price:amount with og:price:currency). -->
<html>
<head>
<meta charset="utf-8">
<title>Pour-over Kettle</title>
<meta property="og:type" content="product">
<meta property="og:title" content="Pour-over Kettle">
<meta property="og:price:amount" content="1,249.50">
<meta property="og:price:currency" content="USD">
<meta property="product:price:amount" content="1249.50">
</head>
<body><h1>Pour-over Kettle</h1><span class="money">$1,249.50</span></body>
</html>
