<!doctype html>
<!-- Imitates an Indian marketplace's product page: a JSON-LD Product with
     the deal price, the list price (M.R.P.) crossed out next to it, and the
     deal price split into symbol and whole-number spans. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Noise Cancelling Headphones WH-1000 : Amazon-ish.in : Electronics</title>
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Product","name":"Noise Cancelling Headphones WH-1000",
 "offers":{"@type":"Offer","price":"19999","priceCurrency":"INR"}}
</script>
</head>
<body>
<nav><a href="/">Home</a> <span class="nav-cart">Cart ₹0</span></nav>
<div id="dp">
  <h1 id="productTitle">Noise Cancelling Headphones WH-1000</h1>
  <div id="corePrice">
    <table class="a-lineitem">
      <tr><td class="a-color-secondary">M.R.P.:</td>
          <td><span class="a-price a-text-strike"><span class="a-offscreen">₹24,990</span></span></td></tr>
      <tr><td class="a-color-secondary">Deal Price:</td>
          <td><span class="a-price"><span class="a-price-symbol">₹</span><span class="a-price-whole">19,999<span class="a-price-decimal">.</span></span></span></td></tr>
      <tr><td class="a-color-secondary">You Save:</td>
          <td><span class="a-color-price">₹4,991 (20%)</span></td></tr>
    </table>
  </div>
  <p class="a-spacing-small">Inclusive of all taxes. EMI starts at ₹970 per month on orders over ₹3,000 with select cards and banks.</p>
  <div id="exchange"><span class="label">With Exchange</span> <span class="a-price"><span class="a-offscreen">Up to ₹3,150.00 off</span></span></div>
</div>
<footer><span>Gift cards from ₹100</span></footer>
</body>
</html>
