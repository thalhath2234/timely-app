<!doctype html>
<!-- Imitates a status page whose only moving parts are a relative time, an
     "Updated" stamp and a clock time; the content stays the same. -->
<html>
<head><meta charset="utf-8"><title>Service status</title></head>
<body>
<h1>All systems operational</h1>
<p class="stamp">Updated 06 Nov 2026, 09:14 IST</p>
<ul>
  <li>API: operational (checked 5 minutes ago)</li>
  <li>Dashboard: operational, last incident at 09:14</li>
</ul>
</body>
</html>
