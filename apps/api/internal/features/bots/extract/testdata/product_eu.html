<!doctype html>
<!-- Imitates a German shop: microdata whose price is the text people read,
     "1.299,99 €", with no content attribute and no priceCurrency. -->
<html lang="de">
<head><meta charset="utf-8"><title>Espressomaschine</title></head>
<body>
<div itemscope itemtype="http://schema.org/Product">
  <h1 itemprop="name">Espressomaschine Duo</h1>
  <p>Preis: <span class="preis" itemprop="price">1.299,99 €</span> inkl. MwSt.</p>
</div>
</body>
</html>
