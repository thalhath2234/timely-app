# Skill-body rule (plan 9b.2). timely_learning stages a skill write (skill_manage; never an About
# you or Notes write) for the person to confirm when its text matches either list. A match never blocks a skill outright; it only means
# the write waits in Timely instead of applying silently.
#
# tool_tokens       names of every tool whose chat policy is approve or block in policy/tools.yaml,
#                   matched as whole tokens. Generated: never edit by hand; regenerate with
#                   `python3 -I scripts/hermes-sync/check_sync.py --write` after changing tools.yaml.
#                   `make hermes-sync-check` fails when the list and tools.yaml disagree.
# authority_patterns  Python regular expressions for approval and authority wording, matched
#                   case-insensitively (re.IGNORECASE) anywhere in the text. Reviewed by hand like
#                   tools.yaml; each must compile.

