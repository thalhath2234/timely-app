authority_patterns:
  - 'approv'
  - 'pre-?approved'
  - 'permission'
  - 'allow-?list'
  - '--yes\b'
  - '\bsudo\b'
  - 'always allow'
  - 'don''?t (ask|confirm|check)'
  - 'do not (ask|confirm|check)'
  - 'without (asking|confirmation|approval|permission)'
  - 'no need to (ask|confirm)'
  - 'skip (the )?(approval|confirmation|review)'
  - 'ignore (all )?(previous|prior|above|earlier) instructions'
  - 'disregard (all )?(previous|prior|above|earlier) instructions'
  - 'dangerously'
  - 'bypass'
  - '\byolo\b'
  - 'full access'
  - 'auto-?(run|execute|accept)'
