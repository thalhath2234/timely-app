# Tool policy for Timely's agent (plan section 8.1). Checked by `make hermes-sync-check`
# (scripts/hermes-sync/check_policy.py) against the runtime tool dump.
#
# PHASE 1: timely_gate does not read this file yet; phase 2 makes it enforce what follows. Until
# then the gate blocks the hard-coded names in timely_agent/policy.py, runs the few
# policy.LOCAL_ALLOW tools without asking, and sends every other call to Go (`gate.ask`), which
# fails closed. So "blocked", "owner mismatch" and "phase" below describe the phase-2 gate.
#
# Every tool Hermes registers is listed here, keyed `<name>@<owner>`. Owner is `core` (registered by
# a module in the copy), `plugin:<plugin key>` (registered by a bundled or Timely plugin) or
# `mcp:<server>`. At dispatch the gate resolves the live owner; an owner that differs from the entry
# is blocked, and a name with no entry is blocked (`unknown: block`). External MCP tools are not
# listed: each account sets them per tool in Settings (Can use = allow, Ask me first = approve,
# Off = block). Nous connector tools (`connectors__*`) have no entry, so they stay blocked.
#
# Fields:
#   toolset  the registry toolset (must match the dump)
#   chat     allow | approve | block   in a chat run
#   bot      allow | approve | block   in a bot tick (phase 6)
#   phase    the rollout phase that first offers the tool (section 13); `later` = after phase 8,
#            `never` = stays blocked. A tool is offered only once its phase has shipped, whatever
#            `chat`/`bot` say.
#   gates    extra rules the gate applies on top of allow/approve (vocabulary below)
#   schema   sha256 of the registry schema (canonical JSON) last reviewed. Required, and checked,
#            for any tool that is not `block` in both run kinds: a changed schema fails the check
#            until a developer reads the new schema and updates this hash.
#   note     why, in one line
#
# Gates:
#   learning              timely_learning stages or blocks the write (9b.2); in bot runs every write is staged
#   timely-skills-readonly  skill_manage on a Timely skill (skills.external_dirs) is blocked (9.1)
#   session-taint         a hit from a tainted or bot-started conversation taints the session
#   delegate-cap          at most 3 children with a shared budget; a child's taint taints the parent
#   web-toggle            blocked when the chat's web toggle is off, in Sensitive and in answer-only runs
#   bot-egress            bot egress policy (7.5); Reads hosts go through the polite fetcher
#   xai-key               offered only when the account has an xAI key
#   host-path-approve     a local host path argument needs approval
#   urls-only             bot runs accept URLs only
#   skills-folder-allow   no approval needed inside the account's own skills folder
#   clarify-card          the gate turns the call into a Timely card (phase 4, Q-4.3)
#   no-secret-capture     skill secret capture is off
#   private-target        a URL in the arguments (literal, or a name resolving) to a private, loopback,
#                         link-local or CGNAT/Tailscale address is blocked; Hermes' local browser ignores
#                         security.allow_private_urls. Enforced by timely_gate from phase 1 (every
#                         browser_* tool), before Go is asked
#
# Count at v0.23.0: 83 registered tools with every bundled plugin enabled (73 core, 5 from
# plugin:platforms/a2a, 5 from plugin:google_meet). Plan 8.1's "73" came from upstream main 334f66b8,
# a later commit where the 5 Yuanbao tools (yb_*) had left core, with only default plugins loaded
# (google_meet is opt-in, so its 5 meet_* tools were missing). Both groups are classified below as
# block. Runtime dump: apps/agent/.hermes-sync/tools.json.
#
# After a sync: a new tool fails the check until it has an entry here; a removed tool fails until
# its entry is deleted; a changed schema on an allowed or approved tool fails until `schema` is
# updated. The subset of YAML used here (block maps, flow lists, quoted strings) is parsed strictly
# by scripts/hermes-sync/check_lib.py; keep values on one line.

