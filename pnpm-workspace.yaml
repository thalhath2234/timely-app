packages:
  - apps/web
  - apps/mobile
  - packages/*

# Expo >= 54 supports pnpm's default isolated node_modules. If a React Native
# library ever fails to build/resolve because of symlinks, uncomment this:
# nodeLinker: hoisted

allowBuilds:
  sharp: true
  unrs-resolver: false
  electron: true
  esbuild: true
  electron-builder: true
  electron-winstaller: true

minimumReleaseAgeExclude:
  - '@next/env@16.3.8'
  - '@next/eslint-plugin-next@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - '@tiptap/core@3.31.4'
  - '@tiptap/extension-blockquote@3.31.4'
  - '@tiptap/extension-bold@3.31.4'
  - '@tiptap/extension-bubble-menu@3.31.4'
  - '@tiptap/extension-bullet-list@3.31.4'
  - '@tiptap/extension-code-block@3.31.4'
  - '@tiptap/extension-code@3.31.4'
  - '@tiptap/extension-document@3.31.4'
  - '@tiptap/extension-dropcursor@3.31.4'
  - '@tiptap/extension-floating-menu@3.31.4'
  - '@tiptap/extension-gapcursor@3.31.4'
  - '@tiptap/extension-hard-break@3.31.4'
  - '@tiptap/extension-heading@3.31.4'
  - '@tiptap/extension-highlight@3.31.4'
  - '@tiptap/extension-horizontal-rule@3.31.4'
  - '@tiptap/extension-italic@3.31.4'
  - '@tiptap/extension-link@3.31.4'
  - '@tiptap/extension-list-item@3.31.4'
  - '@tiptap/extension-list-keymap@3.31.4'
  - '@tiptap/extension-list@3.31.4'
  - '@tiptap/extension-ordered-list@3.31.4'
  - '@tiptap/extension-paragraph@3.31.4'
  - '@tiptap/extension-strike@3.31.4'
  - '@tiptap/extension-table@3.31.4'
  - '@tiptap/extension-task-item@3.31.4'
  - '@tiptap/extension-task-list@3.31.4'
  - '@tiptap/extension-text@3.31.4'
  - '@tiptap/extension-underline@3.31.4'
  - '@tiptap/extensions@3.31.4'
  - '@tiptap/pm@3.31.4'
  - '@tiptap/react@3.31.4'
  - '@tiptap/starter-kit@3.31.4'
  - '@tiptap/suggestion@3.31.4'
  - eslint-config-next@16.3.8
  - next@16.3.8

# Security overrides for transitive advisories (docs/qa/2026-10-01 QA-04).
# Each key is scoped to the dependent that pins the vulnerable range so the
# override cannot silently retarget an unrelated copy of the package.
overrides:
  "postcss>nanoid": ">=3.3.18"
  "baseline-browser-mapping@<2.11.0": ">=2.11.0"
  "fast-uri@<3.1.8": ">=3.1.8"
  "brace-expansion@>=4.0.0 <5.0.12": ">=5.0.12"
  "query-string>decode-uri-component": ">=0.4.3"
  "xcode>uuid": ">=11.1.1"
