# Desktop installers + Android APK for a tagged release.
#
# Push a tag `v<version>` that matches apps/web/package.json → one GitHub
# Release with AppImage, dmg/zip, nsis exe, their latest*.yml update manifests
# (electron-updater) and the APK. workflow_dispatch builds the same artifacts
# as workflow artifacts only (nothing is published).
#
# All signing secrets are optional; without them the builds are unsigned
# (see docs/desktop/README.md, "Build and release").

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(node -p "require('./apps/web/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF" != "refs/tags/v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match apps/web/package.json version $version"
            exit 1
          fi
      # Create the release once so the matrix jobs do not race to create it.
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "Timely $GITHUB_REF_NAME" --generate-notes

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          # Both mac architectures in one job so a single latest-mac.yml lists
          # both files (two jobs would overwrite each other's manifest).
          - os: macos-14
            target: darwin-x64,darwin-arm64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Cache PostgreSQL downloads
        uses: actions/cache@v4
        with:
          path: apps/web/.cache/postgres
          # runner.os, not matrix.target: cache keys cannot contain commas and the
          # mac target is "darwin-x64,darwin-arm64". One desktop job per OS keeps it unique.
          key: zonky-postgres-${{ runner.os }}-${{ hashFiles('apps/web/electron/targets.mjs') }}
      - run: pnpm install --frozen-lockfile
      - name: Build and package (${{ matrix.target }})
        shell: bash
        working-directory: apps/web
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The release is created by the prepare job; let electron-builder
          # upload to it even when a re-run happens hours later.
          EP_GH_IGNORE_TIME: "true"
          # macOS: Developer ID certificate (.p12, base64) + notarization
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows: code-signing certificate (.pfx, base64)
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: node electron/pack.mjs --target "${{ matrix.target }}" --publish "$PUBLISH"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          if-no-files-found: error
          path: |
            apps/web/release/*.AppImage
            apps/web/release/*.dmg
            apps/web/release/*.exe
            apps/web/release/*.zip
            apps/web/release/*.yml
            apps/web/release/*.blockmap

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # v3 defaults to installing the removed `tools` package and fails on every run.
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Generate the native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build the release APK
        working-directory: apps/mobile/android
        env:
          # Optional. Without a keystore the APK is signed with the debug key
          # that `expo prebuild` configures.
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          signing=()
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            signing=(
              "-Pandroid.injected.signing.store.file=$PWD/app/release.keystore"
              "-Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD"
              "-Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS"
              "-Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD"
            )
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with the debug key"
          fi
          ./gradlew app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon "${signing[@]}"
          cp app/build/outputs/apk/release/app-release*.apk \
             "$GITHUB_WORKSPACE/Timely-${{ needs.prepare.outputs.version }}-android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          if-no-files-found: error
          path: Timely-*-android-arm64.apk
      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" Timely-*-android-arm64.apk --repo "$GITHUB_REPOSITORY" --clobber
