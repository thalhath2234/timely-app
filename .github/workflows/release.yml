# Desktop installers + Android APK for a tagged release.
#
# Push a tag `v<version>` that matches apps/web/package.json → one GitHub
# Release with AppImage, nsis exe, their latest*.yml update manifests
# (electron-updater) and the APK. workflow_dispatch builds the same artifacts
# as workflow artifacts only (nothing is published).
#
# All signing secrets are optional; without them the desktop builds are
# unsigned and the APK is signed with the debug key (see docs/desktop/README.md,
# "Build and release").

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Read-only by default; only the jobs that publish to the Release get write.
permissions:
  contents: read

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: version
        run: |
          version=$(node -p "require('./apps/web/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF" != "refs/tags/v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match apps/web/package.json version $version"
            exit 1
          fi
      # Create the release once so the matrix jobs do not race to create it.
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "Timely $GITHUB_REF_NAME" --generate-notes

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          # No macOS: releases ship Windows, Linux and Android only.
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    # electron-builder uploads the installers and update manifests itself.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Cache PostgreSQL downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: apps/web/.cache/postgres
          # One desktop job per OS keeps runner.os unique.
          key: zonky-postgres-${{ runner.os }}-${{ hashFiles('apps/web/electron/targets.mjs') }}
      - run: pnpm install --frozen-lockfile
      - name: Build and package (${{ matrix.target }})
        shell: bash
        working-directory: apps/web
        env:
          # The released "Timely" (electron-builder.yml, electron/flavor.ts).
          # Without it pack.mjs builds the side-by-side "Timely Dev".
          TIMELY_RELEASE: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The release is created by the prepare job; let electron-builder
          # upload to it even when a re-run happens hours later.
          EP_GH_IGNORE_TIME: "true"
          # Windows: code-signing certificate (.pfx, base64)
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: node electron/pack.mjs --target "${{ matrix.target }}" --publish "$PUBLISH"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-${{ matrix.target }}
          if-no-files-found: error
          path: |
            apps/web/release/*.AppImage
            apps/web/release/*.exe
            apps/web/release/*.yml
            apps/web/release/*.blockmap

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      # v3 defaults to installing the removed `tools` package and fails on every run.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - run: pnpm install --frozen-lockfile
      - name: Generate the native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build the release APK
        working-directory: apps/mobile/android
        env:
          # Required for tagged releases: the debug key `expo prebuild` falls
          # back to is public, so anyone could sign an "update" to the app.
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          signing=()
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            signing=(
              "-Pandroid.injected.signing.store.file=$PWD/app/release.keystore"
              "-Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD"
              "-Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS"
              "-Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD"
            )
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with the debug key"
          fi
          ./gradlew app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon "${signing[@]}"
          cp app/build/outputs/apk/release/app-release*.apk \
             "$GITHUB_WORKSPACE/Timely-${{ needs.prepare.outputs.version }}-android-arm64.apk"
      - name: Remove the keystore
        if: always()
        run: rm -f apps/mobile/android/app/release.keystore
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-arm64
          if-no-files-found: error
          path: Timely-*-android-arm64.apk

  # Separate from the build so `pnpm install` and Gradle never run with a
  # token that can write to the Release.
  android-release:
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: android-arm64
      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" Timely-*-android-arm64.apk --repo "$GITHUB_REPOSITORY" --clobber
