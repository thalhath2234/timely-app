# Lint, type-check and unit-test every app. Only the chat-integration job needs
# a database (a throwaway PostgreSQL service); elsewhere the Go integration
# tests stay gated behind CHAT_TEST_ENV / TIMELY_TEST_POSTGRES.

name: ci

on:
  pull_request:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: make lint-api
      - run: make test-api

  # Chat runs, approvals, permission modes and the agent engine against the Go
  # fake worker (plan phase 2), each test in its own schema of a throwaway
  # PostgreSQL. No AI provider and no Python runtime: the real-worker test
  # skips without TIMELY_AGENT_TEST_RUNTIME.
  chat-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: timely
          POSTGRES_PASSWORD: root123
          POSTGRES_DB: timely_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U timely -d timely_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      # The example's DB_* settings match the service above; the target reads
      # them through CHAT_TEST_ENV=.env.
      - run: cp .env.example .env
      - run: make test-chat-integration

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make lint-web
      # next-env.d.ts and the route types are generated, not committed.
      - run: pnpm --filter @timely/web exec next typegen
      - run: make typecheck-web
      - run: make typecheck-mobile
      # Keep in sync with the `test` target in the Makefile (minus test-api).
      - run: make test-sheet-formulas
      - run: make test-markdown-parity
      - run: make test-view-language
      - run: make test-mobile-assistant
      - run: make test-mobile-offline
      - run: make test-mobile-server-config
      - run: make test-mobile-keyboard-taps
      - run: make test-electron-guards
      - run: make test-electron-supervisor
      - run: make test-desktop-instance
      - run: make test-agent-chat
      - run: make test-agent-learning
      - run: make test-stage-agent

  # The agent runtime (apps/agent: vendored Hermes + timely_agent) and the Go
  # supervisor that spawns it. Stub model only: no AI provider is called.
  agent:
    runs-on: ubuntu-latest
    # agent-go-integration's backup round trip runs the goose chain in PostgreSQL.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: timely
          POSTGRES_PASSWORD: root123
          POSTGRES_DB: timely_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U timely -d timely_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          # The uv the Docker image copies (apps/api/Dockerfile); scripts/stage-agent.test.mjs checks they match.
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: apps/agent/hermes/uv.lock
      # agent-contract includes contract tests 9 (learning) and 13 (agent-state
      # backup) and the web tests (timely_web and Hermes' untrusted wrapping,
      # secret-URL and SSRF floors on the timely and keyed backends, Q-3.9).
      - run: make agent-install agent-lint agent-test agent-contract
      # spawn -> hello -> ready -> run.start (stub model) -> run.done -> shutdown,
      # and the agent-state backup round trip (fails, not skips, without the database)
      - run: cp .env.example .env
      - run: make agent-go-integration AGENT_REQUIRE_DB=1

  # Phase 1 proves the Windows spawn path (stdin/stdout pipes, Job Object)
  # before anything ships. The steps mirror `make agent-install` and
  # `make agent-go-integration`: the Windows runner has no GNU make.
  agent-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Git for Windows checks text out with CRLF (core.autocrlf=true); the agent runtime
      # needs the committed bytes (apps/agent/.gitattributes says so too).
      - name: Check files out as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          # The uv the Docker image copies (apps/api/Dockerfile); scripts/stage-agent.test.mjs checks they match.
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: apps/agent/hermes/uv.lock
      - name: Build the Go API
        run: cd apps/api && go build ./...
      - name: Install the agent runtime (make agent-install)
        run: |
          # Same recipe and pins as the Makefile's agent-install (version read from it, so they cannot drift).
          version=$(sed -n 's/^AGENT_PYTHON_VERSION ?= *//p' Makefile)
          test -n "$version"
          extras=$(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' apps/agent/.hermes-sync/extras.txt | sed 's/^/--extra /' | tr '\n' ' ')
          cd apps/agent/hermes
          UV_PROJECT_ENVIRONMENT="$GITHUB_WORKSPACE/apps/agent/.venv" uv sync --frozen --no-install-project \
            --managed-python --python "$version" --group dev $extras
      - name: Go supervisor tests with the real worker (spawn, hello, ready, run.start on a stub model, shutdown)
        run: cd apps/api && TIMELY_AGENT_TEST_RUNTIME=dev go test ./internal/agenthost/... -count=1 -v
      - name: Contract test 19 (protocol stays clean when tools and children write to stdout)
        run: cd apps/agent && .venv/Scripts/python.exe -I -m pytest -q tests/contract -k c19

  # Phase 3b (plan 11.4): the runtime every desktop installer ships, staged the
  # way release.yml stages it, on both release OSes, so Windows staging is
  # checked on every PR without a tag. The stage scripts use only node:
  # builtins, so there is no pnpm install. The smoke runs `python -I boot.py`,
  # prepare and the Go real worker (hello, ready, a run on its stub model, no
  # AI provider) from a read-only copy, and fails on any write into it. The
  # runner has no GNU make on Windows, so the steps call the scripts directly
  # (make stage-agent and make smoke-agent READ_ONLY=1 run the same commands).
  agent-stage:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Git for Windows checks text out with CRLF (core.autocrlf=true); the agent runtime
      # needs the committed bytes (apps/agent/.gitattributes says so too).
      - name: Check files out as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          # Staging needs only node: builtins. setup-node v5 caches the packageManager
          # from package.json (pnpm) by default, and this job installs no pnpm.
          package-manager-cache: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          # The uv the Docker image copies (apps/api/Dockerfile); scripts/stage-agent.test.mjs checks they match.
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: apps/agent/hermes/uv.lock
      # The python-build-standalone archive, sha256-checked against pm/lock.json
      # before use. One job per OS keeps runner.os unique; keys cannot hold commas.
      - name: Cache the interpreter download
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: apps/web/.cache/agent
          key: agent-python-${{ runner.os }}-${{ hashFiles('apps/agent/hermes/pm/lock.json') }}
      # eu-strip strips the Linux interpreter's debug info (GNU strip breaks it).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y elfutils
      - name: Stage the agent runtime (host target)
        run: node apps/web/electron/stage-agent.mjs 2>&1 | tee stage-agent.log
      - name: Smoke-test it read-only (boot.py, prepare, the Go worker on a stub model)
        run: node apps/web/electron/smoke-agent.mjs --read-only
      - name: Size summary
        if: success() || failure()
        run: |
          {
            echo "### Agent runtime on ${RUNNER_OS}"
            manifest=$(ls apps/web/.electron-agent/*/MANIFEST.json 2>/dev/null | head -n 1 || true)
            if [[ -n "$manifest" ]]; then
              node -e '
                const m = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
                const mb = (b) => `${(b / 1048576).toFixed(1)} MiB`;
                const folders = new Map();
                for (const [rel, size] of m.files) {
                  const key = rel.split("/").slice(0, 2).join("/");
                  folders.set(key, (folders.get(key) ?? 0) + size);
                }
                console.log("| Target | Python | Hermes | Files | Unpacked |");
                console.log("| --- | --- | --- | --- | --- |");
                console.log(`| ${m.target} | ${m.python} | ${m.hermesTag} | ${m.totals.files} | ${mb(m.totals.bytes)} |`);
                console.log("");
                console.log("| Folder | Size |");
                console.log("| --- | --- |");
                for (const [folder, size] of [...folders].sort((a, b) => b[1] - a[1]).slice(0, 10)) {
                  console.log(`| ${folder} | ${mb(size)} |`);
                }
              ' "$manifest"
            else
              echo "No MANIFEST.json: staging did not finish."
            fi
            echo ""
            echo '```'
            tail -n 40 stage-agent.log 2>/dev/null || echo "no stage log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Plan 11.5: the API image (Debian slim with the staged runtime), checked by
  # scripts/docker-agent-smoke.sh: the runtime read-only as uid 10001, the Go
  # real worker inside the image on its stub model, and the API with a
  # throwaway PostgreSQL. linux/amd64 only; arm64 is not built by any job.
  # Runs on pushes to dev and on PRs that touch the image or the runtime.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT" != pull_request ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          # Everything the image copies (apps/api holds the Dockerfile; the Makefile gives
          # AGENT_PYTHON_VERSION), what the smoke reads, and this job; scripts/stage-agent.test.mjs checks it.
          elif git diff --quiet "origin/$BASE_REF...HEAD" -- apps/api .dockerignore Makefile apps/agent \
              apps/web/electron/stage-agent.mjs apps/web/electron/stage-agent-lib.mjs apps/web/electron/targets.mjs \
              scripts/docker-agent-smoke.sh docker-compose.yml .github/workflows/ci.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - if: steps.changed.outputs.run == 'true'
        run: make docker-agent-smoke

  # Plan 10.4 a-e on pull requests that touch the agent or the sync tooling.
  hermes-sync-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # check.sh walks history to the last "hermes: snapshot" commit.
          fetch-depth: 0
      - id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Also what the check reads outside those folders: agenthost/env.go (the messaging-platform
          # env check) and the Makefile (agent-install recipe, AGENT_PYTHON_VERSION).
          if git diff --quiet "origin/$BASE_REF...HEAD" -- apps/agent scripts/hermes-sync scripts/sync-hermes.sh \
              apps/api/internal/agenthost/env.go Makefile .github/workflows/ci.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          # The uv the Docker image copies (apps/api/Dockerfile); scripts/stage-agent.test.mjs checks they match.
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: apps/agent/hermes/uv.lock
      # agent-test and agent-contract run in the agent job
      - if: steps.changed.outputs.run == 'true'
        run: make hermes-sync-check HERMES_CHECK_NO_TESTS=1
