# Lint, type-check and unit-test every app. No database is needed: the Go
# integration tests are gated behind CHAT_TEST_ENV / TIMELY_TEST_POSTGRES.

name: ci

on:
  pull_request:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: make lint-api
      - run: make test-api

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make lint-web
      # next-env.d.ts and the route types are generated, not committed.
      - run: pnpm --filter @timely/web exec next typegen
      - run: make typecheck-web
      - run: make typecheck-mobile
      # Keep in sync with the `test` target in the Makefile (minus test-api).
      - run: make test-sheet-formulas
      - run: make test-mobile-assistant
      - run: make test-mobile-offline
      - run: make test-mobile-server-config
      - run: make test-electron-guards
      - run: make test-electron-supervisor
      - run: make test-desktop-instance
