\* The apply check: a proposal waits for approval; lanes race to apply it.
\* run.sh copies this file and sets each guard constant (ClaimLocksRow ...
\* HoldsSupervised) from the Go source; the values written here are what the
\* code had at the sync commit in ../SKILL.md. AgentRunTurn.cfg is the turn
\* check (engines, the follower, permission modes).
CONSTANTS
  Workers = {w1, w2, w3}
  NSteps = 2
  MaxLeases = 4
  MaxStops = 1
  MaxRetries = 2
  MaxCrashes = 1
  MaxSends = 1
  MaxSwitches = 0
  AllowDelete = TRUE
  AllowAgent = FALSE
  Mode = "supervised"
  FromMessage = FALSE
  ClaimLocksRow = TRUE
  StepFenced = TRUE
  WritesInStepTx = TRUE
  ApplySkipsDone = TRUE
  CheckpointFenced = TRUE
  CheckpointReadsLatest = TRUE
  RetryKeepsDone = TRUE
  HoldsSupervised = TRUE
  AnswerFenced = TRUE
  MaxAsks = 0
SPECIFICATION Spec
SYMMETRY Symm
INVARIANTS
  TypeOK
  AtMostOnce
  DoneMatchesWrites
  StopHolds
  OneDoneNotice
  DoneMeansComplete
  SupervisedHolds
  NoAnswerAfterEnd
CHECK_DEADLOCK FALSE
