\* Bounds for AgentRunApply. run.sh copies this file and sets each guard
\* constant (ClaimLocksRow ... RetryKeepsDone) from the Go source; the values
\* written here are what the code had at the sync commit in ../SKILL.md.
CONSTANTS
  Workers = {w1, w2, w3}
  NSteps = 2
  MaxLeases = 4
  MaxStops = 1
  MaxRetries = 2
  MaxCrashes = 1
  MaxSends = 1
  AllowDelete = TRUE
  ClaimLocksRow = TRUE
  StepFenced = TRUE
  WritesInStepTx = TRUE
  ApplySkipsDone = TRUE
  CheckpointFenced = TRUE
  CheckpointReadsLatest = TRUE
  RetryKeepsDone = TRUE

SPECIFICATION Spec
SYMMETRY Symm
INVARIANTS
  TypeOK
  AtMostOnce
  DoneMatchesWrites
  StopHolds
  OneDoneNotice
  DoneMeansComplete
CHECK_DEADLOCK FALSE
