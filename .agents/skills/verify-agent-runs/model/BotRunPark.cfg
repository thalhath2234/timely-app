\* The bot check (phase 6): a Bot's tick parks one step as a card on its Bot
\* thread (ParkCard); the person answers it Run once or Deny, twice at most
\* (AnswerOnce, AnswerDeny: a retry or a second device), it may expire
\* (ExpireHost), and the person may Stop or delete the thread at any time.
\* Run once's continuation sends its bot.run only while the thread runs it
\* under its lease (ContSend, ContFenced), the worker runs the approved call
\* at most once and never after run.stop (RunCall), and the continuation ends
\* fenced on its lease (ContDone). Module BotRunPark.tla; run.sh sets the
\* guard constants from the Go source.
CONSTANTS
  MaxAnswers = 2
  MaxStops = 1
  AllowDelete = TRUE
  BotAnswerFenced = TRUE
  BotContFenced = TRUE
  BotStopReaches = TRUE
SPECIFICATION Spec
INVARIANTS
  TypeOK
  HostResolvesOnce
  NoHostToolAfterStop
  ContinuationOnce
CHECK_DEADLOCK FALSE
