\* The host check (phase 5): a new message; two lanes claim it and run the
\* turn on either engine; an agent run asks one host card, which waits live
\* (AskHost), parks when the wait ends or its worker or process goes
\* (ParkHost, ParkOrphan), is answered Run once live (AnswerHostLive, the
\* re-attach, then DeliverHost) or parked (AnswerHostParked, a continuation
\* the claim takes off the row), expires (ExpireHost), and runs at most once
\* (RunHostTool), while the person may Stop, Retry, send, approve, reject or
\* delete. No question card and one step keep it apart from the turn check.
\* run.sh sets the guard constants from the Go source.
CONSTANTS
  Workers = {w1, w2}
  NSteps = 1
  MaxLeases = 4
  MaxStops = 1
  MaxRetries = 1
  MaxCrashes = 1
  MaxSends = 1
  MaxSwitches = 0
  AllowDelete = TRUE
  AllowAgent = TRUE
  Mode = "auto"
  FromMessage = TRUE
  ClaimLocksRow = TRUE
  StepFenced = TRUE
  WritesInStepTx = TRUE
  ApplySkipsDone = TRUE
  CheckpointFenced = TRUE
  CheckpointReadsLatest = TRUE
  RetryKeepsDone = TRUE
  HoldsSupervised = TRUE
  AnswerFenced = TRUE
  MaxAsks = 0
  MaxHost = 1
  HostAnswerFenced = TRUE
  ClaimSkipsHostWait = TRUE
  ApproveRefusesHost = TRUE
  ContinuationClearedAtClaim = TRUE
  StopDeniesHost = TRUE
SPECIFICATION Spec
SYMMETRY Symm
INVARIANTS
  TypeOK
  AtMostOnce
  DoneMatchesWrites
  StopHolds
  OneDoneNotice
  DoneMeansComplete
  SupervisedHolds
  NoAnswerAfterEnd
  HostResolvesOnce
  NoHostToolAfterStop
  HostNotAProposal
  NoLeaseOnHostWait
  ContinuationOnce
CHECK_DEADLOCK FALSE
