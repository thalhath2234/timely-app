\* The turn check: a new message; a lane claims it and runs the turn on the
\* classic or the agent engine (Start hands it to a follower; a re-claim
\* calls Lost); the turn records a proposal that waits for Approve or
\* applies at once, as the chat's permission mode decides, while the person
\* may switch the mode, Stop, Retry, steer or delete. Two lanes and one step
\* keep it near 30 s; AgentRunApply.cfg covers three lanes over two steps.
\* run.sh sets the guard constants from the Go source, as for the apply check.
CONSTANTS
  Workers = {w1, w2}
  NSteps = 1
  MaxLeases = 4
  MaxStops = 1
  MaxRetries = 1
  MaxCrashes = 1
  MaxSends = 1
  MaxSwitches = 1
  AllowDelete = TRUE
  AllowAgent = TRUE
  Mode = "supervised"
  FromMessage = TRUE
  ClaimLocksRow = TRUE
  StepFenced = TRUE
  WritesInStepTx = TRUE
  ApplySkipsDone = TRUE
  CheckpointFenced = TRUE
  CheckpointReadsLatest = TRUE
  RetryKeepsDone = TRUE
  HoldsSupervised = TRUE
SPECIFICATION Spec
SYMMETRY Symm
INVARIANTS
  TypeOK
  AtMostOnce
  DoneMatchesWrites
  StopHolds
  OneDoneNotice
  DoneMeansComplete
  SupervisedHolds
CHECK_DEADLOCK FALSE
